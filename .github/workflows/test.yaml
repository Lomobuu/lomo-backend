name: Terraform

on:
  workflow_dispatch:

jobs:

  backend:

    uses: Lomobuu/terraform-bootstrap/.github/workflows/bootstrap-backend.yml@v1

    with:
      resource_group_name: rg-dev-tfstate
      storage_account_name: fznstatestorageacc # UNIQUE
      container_name: tfstate
      location: northeurope

    secrets: inherit

  terraform:

    needs: backend

    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:

      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ needs.backend.outputs.resource_group_name }}" \
            -backend-config="storage_account_name=${{ needs.backend.outputs.storage_account_name }}" \
            -backend-config="container_name=${{ needs.backend.outputs.container_name }}" \
            -backend-config="key=terraform.tfstate" \
            -backend-config="use_azuread_auth=true"

      - name: Terraform Plan
        run: terraform plan